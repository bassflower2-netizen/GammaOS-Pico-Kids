name: GammaOS Pico Kids - build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Kids patch repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies and 32-bit zlib runtime
        run: |
          set -euo pipefail
          # The vendor logo tool zpipe needs libz.so.1. On 64-bit runners
          # its legacy x86 (32-bit) runtime is not installed by default.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git make unzip zip file python3 python3-pil python3-numpy \
            openssl gcc-arm-none-eabi libnewlib-arm-none-eabi \
            zlib1g:amd64 libc6:i386 zlib1g:i386

      - name: Fetch official GammaOS Pico source code
        run: |
          git clone --single-branch --branch lk-gba-emu-sd-card-kpa \
            https://github.com/TheGammaSqueeze/lk-mt6785.git lk-mt6785
          git -C lk-mt6785 rev-parse HEAD | tee gammaos-source-commit.txt

      # Prefer every exact gitlink commit. Only when that commit is not fetchable,
      # use the remote's default branch HEAD for that particular module. Handles
      # ALL top-level cores and their NESTED upstream dependencies.
      # Fallback versions are different from the original pinned ones; this
      # deliberately creates an UNTESTED build and MUST NOT be flashed as-is.
      - name: Fetch submodules (automatic fallback for unavailable commits)
        shell: bash
        run: |
          set -euo pipefail
          : > fallback-submodules.txt

          load_modules() {
            local parent="$1"
            local key subpath pinned actual
            if [[ ! -f "$parent/.gitmodules" ]]; then
              return 0
            fi

            git -C "$parent" submodule sync
            while read -r key subpath; do
              [[ -n "$subpath" ]] || continue
              echo "::group::Fetching $parent/$subpath"
              pinned="$(git -C "$parent" ls-tree HEAD -- "$subpath" | awk '{print $3}')"

              if git -C "$parent" submodule update --init -- "$subpath"; then
                echo "Exact pinned commit available: $pinned"
              else
                echo "::warning title=Unavailable submodule commit::${parent}/${subpath}: pinned ${pinned} is not fetchable. Using remote default branch HEAD instead."
                git -C "$parent" submodule update --init --remote -- "$subpath"
                actual="$(git -C "$parent/$subpath" rev-parse HEAD)"
                echo "${parent}/${subpath} | PINNED=${pinned} | FALLBACK=${actual}" | tee -a fallback-submodules.txt
              fi

              test -f "$parent/$subpath/build.sh" || test -f "$parent/$subpath/.gitmodules" || test -d "$parent/$subpath/.git" || test -f "$parent/$subpath/.git"
              echo "Selected: $(git -C "$parent/$subpath" rev-parse HEAD)"
              load_modules "$parent/$subpath"
              echo "::endgroup::"
            done < <(git config -f "$parent/.gitmodules" --get-regexp '^submodule\..*\.path$')
          }

          load_modules lk-mt6785
          git -C lk-mt6785 submodule status --recursive | tee submodule-versions.txt
          if [[ -s fallback-submodules.txt ]]; then
            echo "::warning title=Compatibility testing required::One or more upstream commit IDs were unavailable. Exact substitutes are listed in fallback-submodules.txt."
            cat fallback-submodules.txt
          fi

      - name: Verify and apply Kids restrictions
        run: |
          python3 apply_kids_patch.py lk-mt6785 --check
          python3 apply_kids_patch.py lk-mt6785

      - name: Check prebuilt logo compressor dependencies
        shell: bash
        run: |
          set -euo pipefail
          TOOL="lk-mt6785/dev/logo/tool/zpipe"
          test -x "$TOOL"
          echo "Binary architecture:"
          file "$TOOL"
          echo "Shared library dependencies:"
          ldd "$TOOL" | tee /tmp/gammaos-zpipe-ldd.txt
