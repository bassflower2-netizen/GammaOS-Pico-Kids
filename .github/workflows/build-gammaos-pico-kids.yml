name: GammaOS Pico Kids - build (experimental)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout kids patch repository
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make unzip zip python3 python3-pil python3-numpy \
            openssl gcc-arm-none-eabi libnewlib-arm-none-eabi

      # Clone and submodule update are separated to identify an exit-128 failure.
      - name: Fetch official GammaOS Pico source code
        run: |
          git clone --single-branch --branch lk-gba-emu-sd-card-kpa \
            https://github.com/TheGammaSqueeze/lk-mt6785.git lk-mt6785
          git -C lk-mt6785 rev-parse --short HEAD

      # The LK repository pins a Genesis Plus GX commit (7016c807...) that its
      # public upstream no longer serves. Keep all other pinned core versions.
      # For Genesis only, use the current main branch and preserve its own
      # pinned nested upstream dependencies. This is a compatibility workaround
      # and requires testing; it does not restore the original missing commit.
      - name: Fetch emulator submodules (work around unavailable Genesis commit)
        run: |
          set -euo pipefail
          git -C lk-mt6785 submodule sync
          for core in \
            cores/armGBA-pico \
            cores/armNES-pico \
            cores/gambatte-pico \
            cores/gpsp-pico \
            cores/snes9x-pico; do
            echo "::group::Fetching pinned $core"
            git -C lk-mt6785 submodule update --init --recursive -- "$core"
            echo "::endgroup::"
          done
          echo "::group::Fetching Genesis Plus GX at available main branch"
          git -C lk-mt6785 config submodule.cores/genesis-plus-gx-pico.branch main
          git -C lk-mt6785 submodule update --init --remote -- cores/genesis-plus-gx-pico
          git -C lk-mt6785/cores/genesis-plus-gx-pico submodule sync --recursive
          git -C lk-mt6785/cores/genesis-plus-gx-pico submodule update --init --recursive
          echo "Genesis Plus GX selected commit:"
          git -C lk-mt6785/cores/genesis-plus-gx-pico rev-parse HEAD
          echo "LK originally pinned:"
          git -C lk-mt6785 ls-tree HEAD cores/genesis-plus-gx-pico
          echo "::endgroup::"
          git -C lk-mt6785 submodule status

      - name: Verify and apply Kids restrictions
        run: |
          python3 apply_kids_patch.py lk-mt6785 --check
          python3 apply_kids_patch.py lk-mt6785

      - name: Compile Konkr Pocket Advance firmware and SD contents
        working-directory: lk-mt6785
        run: |
          chmod +x build_konkr_kpa.sh
          ./build_konkr_kpa.sh
          test -s out/lk_a_kpa_signed.img
          test -f out/sdcard/gammaos/boot.cfg

      - name: Package experimental build
        run: |
          mkdir -p kids-output
          cp lk-mt6785/out/lk_a_kpa_signed.img kids-output/
          cp -a lk-mt6785/out/sdcard kids-output/
          cp README_DE.md kids-output/
          cd kids-output
          zip -qr ../GammaOS-Pico-Kids-KPA-UNTESTED.zip .

      - name: Upload build artifact (NOT device-tested)
        uses: actions/upload-artifact@v6
        with:
          name: GammaOS-Pico-Kids-KPA-UNTESTED
          path: GammaOS-Pico-Kids-KPA-UNTESTED.zip
          if-no-files-found: error
