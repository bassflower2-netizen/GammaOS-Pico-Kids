name: GammaOS Pico Kids v0.2.1 - known-good cores (experimental)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-gammaos-pico-kids.yml'
      - 'apply_kids_patch.py'
      - 'apply_kids_game_exit_patch.py'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout Kids patch repository
        uses: actions/checkout@v5

      - name: Install verified GCC 10.3 build toolchain and SD dependencies
        run: |
          set -euo pipefail
          # The vendor logo tool zpipe needs libz.so.1. On 64-bit runners
          # its legacy x86 (32-bit) runtime is not installed by default.
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git make unzip zip file python3 python3-pil python3-numpy curl \
            python3-cairosvg python3-fonttools \
            openssl python3-pip gcc-arm-none-eabi libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib zlib1g:amd64 libc6:i386 zlib1g:i386
          # Not packaged for Jammy; install into the runner-user site packages.
          python3 -m pip install --user --disable-pip-version-check "arabic-reshaper==3.0.0"

      - name: Verify Python dependencies for SD-card generation
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import cairosvg, fontTools, arabic_reshaper, numpy, PIL; print("OK: CairoSVG, fontTools, arabic_reshaper, NumPy, Pillow")'

      # IMPORTANT: Upstream updates change UI strings. This commit is the
      # exact lk-mt6785 version used for the successfully built v0.1 Kids image
      # (recorded in its gammaos-source-commit.txt), not floating HEAD.
      - name: Fetch verified GammaOS Pico source revision (pin v0.1 base)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REVISION="23926b52ffab442e87404c0b0858b55d78a36c70"
          git clone --single-branch --branch lk-gba-emu-sd-card-kpa \
            https://github.com/TheGammaSqueeze/lk-mt6785.git lk-mt6785
          if ! git -C lk-mt6785 cat-file -e "${SOURCE_REVISION}^{commit}" 2>/dev/null; then
            git -C lk-mt6785 fetch origin "$SOURCE_REVISION"
          fi
          git -C lk-mt6785 checkout --detach "$SOURCE_REVISION"
          ACTUAL_REVISION="$(git -C lk-mt6785 rev-parse HEAD)"
          if [[ "$ACTUAL_REVISION" != "$SOURCE_REVISION" ]]; then
            echo "::error title=Unexpected source revision::Expected $SOURCE_REVISION; got $ACTUAL_REVISION"
            exit 1
          fi
          printf '%s\n' "$ACTUAL_REVISION" | tee gammaos-source-commit.txt
          echo "Pinned to the previously successful v0.1 Kids firmware source."

      # Prefer every exact gitlink commit. Only when that commit is not fetchable,
      # use the remote's default branch HEAD for that particular module. Handles
      # ALL top-level cores and their NESTED upstream dependencies.
      # Fallback versions are different from the original pinned ones; this
      # deliberately creates an UNTESTED build and MUST NOT be flashed as-is.
      - name: Fetch submodules (automatic fallback for unavailable commits)
        shell: bash
        run: |
          set -euo pipefail
          : > fallback-submodules.txt

          load_modules() {
            local parent="$1"
            local key subpath pinned actual
            if [[ ! -f "$parent/.gitmodules" ]]; then
              return 0
            fi

            git -C "$parent" submodule sync
            while read -r key subpath; do
              [[ -n "$subpath" ]] || continue
              echo "::group::Fetching $parent/$subpath"
              pinned="$(git -C "$parent" ls-tree HEAD -- "$subpath" | awk '{print $3}')"

              if git -C "$parent" submodule update --init -- "$subpath"; then
                echo "Exact pinned commit available: $pinned"
              else
                echo "::warning title=Unavailable submodule commit::${parent}/${subpath}: pinned ${pinned} is not fetchable. Using remote default branch HEAD instead."
                git -C "$parent" submodule update --init --remote -- "$subpath"
                actual="$(git -C "$parent/$subpath" rev-parse HEAD)"
                echo "${parent}/${subpath} | PINNED=${pinned} | FALLBACK=${actual}" | tee -a fallback-submodules.txt
              fi

              test -f "$parent/$subpath/build.sh" || test -f "$parent/$subpath/.gitmodules" || test -d "$parent/$subpath/.git" || test -f "$parent/$subpath/.git"
              echo "Selected: $(git -C "$parent/$subpath" rev-parse HEAD)"
              load_modules "$parent/$subpath"
              echo "::endgroup::"
            done < <(git config -f "$parent/.gitmodules" --get-regexp '^submodule\..*\.path$')
          }

          load_modules lk-mt6785
          git -C lk-mt6785 submodule status --recursive | tee submodule-versions.txt
          if [[ -s fallback-submodules.txt ]]; then
            echo "::warning title=Compatibility testing required::One or more upstream commit IDs were unavailable. Exact substitutes are listed in fallback-submodules.txt."
            cat fallback-submodules.txt
          fi

      # Some original LK submodule gitlinks no longer resolve. In that case,
      # git submodule update --remote may leave the SNES checkout without its
      # build script. Repair only the affected checkout with the official
      # standalone SNES9x-Pico repository's main branch.
      - name: Verify or repair SNES9x-Pico checkout
        shell: bash
        run: |
          set -euo pipefail
          repo="lk-mt6785/cores/snes9x-pico"
          upstream_url="https://github.com/TheGammaSqueeze/snes9x-pico.git"
          echo "Checking SNES9x checkout at $repo"
          if [[ -f "$repo/build.sh" ]]; then
            echo "SNES9x build.sh exists; preserving current checkout."
          else
            echo "::warning title=SNES9x checkout incomplete::build.sh is missing; cloning official main branch into the SNES9x core directory."
            rm -rf -- "$repo"
            git clone --single-branch --branch main "$upstream_url" "$repo"
            echo "SNES9x checkout reconstructed from $upstream_url (main)" >> fallback-submodules.txt
          fi
          test -f "$repo/build.sh" || {
            echo "::error title=SNES9x checkout still invalid::The official checkout has no build.sh"
            exit 1
          }
          chmod +x "$repo/build.sh"
          git -C "$repo" submodule sync --recursive
          git -C "$repo" submodule update --init --recursive
          test -s "$repo/upstream/snes9x.h" || {
            echo "::error title=SNES9x upstream missing::Cannot find upstream/snes9x.h after submodule checkout"
            exit 1
          }
          bash -n "$repo/build.sh"
          echo "SNES9x-Pico commit: $(git -C "$repo" rev-parse HEAD)"
          git -C lk-mt6785 submodule status --recursive > submodule-versions.txt
          echo "OK: SNES9x build script and nested upstream sources are available."

      # The source tree pins Genesis Plus GX (and SNES9x) commits that may not
      # be available from the public remotes. On affected checkouts,
      # "submodule update --remote" can leave the core directory without
      # build.sh. Preserve existing complete trees, repair only incomplete
      # checkouts from the OFFICIAL Pico port, and verify nested sources.
      # Also guard armNES against the same issue before starting compilation.
      - name: Verify or repair Genesis Plus GX and armNES checkouts
        shell: bash
        run: |
          set -euo pipefail
          verify_core() {
            local name="$1" url="$2" repo="lk-mt6785/cores/$1" actual
            echo "::group::Checking ${name} checkout"
            if [[ ! -f "$repo/build.sh" ]]; then
              echo "::warning title=${name} checkout incomplete::build.sh missing. Cloning official main branch into the core directory."
              rm -rf -- "$repo"
              git clone --single-branch --branch main "$url" "$repo"
              actual="$(git -C "$repo" rev-parse HEAD)"
              printf '%s | RECONSTRUCTED_MAIN=%s | URL=%s\n' "$repo" "$actual" "$url" >> fallback-submodules.txt
            else
              echo "Existing ${name} build.sh found; preserving checkout."
            fi

            if [[ ! -f "$repo/build.sh" ]]; then
              echo "::error title=Missing ${name} build script::${repo}/build.sh is not present even after repair."
              exit 1
            fi
            chmod +x "$repo/build.sh"
            git -C "$repo" submodule sync --recursive
            git -C "$repo" submodule update --init --recursive
            case "$name" in
              genesis-plus-gx-pico)
                test -s "$repo/upstream/core/system.c"
                test -s "$repo/upstream/libretro/libretro.c"
                ;;
              armNES-pico)
                test -s "$repo/upstream/src/nes.c"
                test -s "$repo/zlib/crc32.c"
                ;;
            esac
            bash -n "$repo/build.sh"
            echo "OK: ${name} script, nested upstream sources, and Bash syntax verified."
            echo "Selected commit: $(git -C "$repo" rev-parse HEAD)"
            echo "::endgroup::"
          }
          verify_core genesis-plus-gx-pico https://github.com/TheGammaSqueeze/genesis-plus-gx-pico.git
          verify_core armNES-pico https://github.com/TheGammaSqueeze/armNES-pico.git
          git -C lk-mt6785 submodule status --recursive > submodule-versions.txt

      # v0.1 was device-tested by this project's owner and recorded the exact
      # SNES9x and Genesis+GX Git commits in its submodule-versions.txt.
      # Floating HEAD via submodule fallback could change between build dates.
      # Pin both cores to those known versions, after the missing-checkout repairs.
      - name: Pin SNES9x and Genesis Plus GX to v0.1 working revisions
        shell: bash
        run: |
          set -euo pipefail
          : > pinned-core-revisions.txt
          pin_core() {
            local name="$1" commit="$2" url="$3" repo="lk-mt6785/cores/$1"
            echo "::group::Pin ${name} to tested v0.1 revision"
            test -f "$repo/build.sh" || { echo "::error::Missing $repo/build.sh"; exit 1; }
            if ! git -C "$repo" cat-file -e "${commit}^{commit}" 2>/dev/null; then
              git -C "$repo" fetch --no-tags "$url" "$commit"
            fi
            git -C "$repo" -c advice.detachedHead=false checkout --detach --force "$commit"
            local actual
            actual="$(git -C "$repo" rev-parse HEAD)"
            [[ "$actual" == "$commit" ]] || { echo "::error::Incorrect $name revision $actual"; exit 1; }
            git -C "$repo" submodule sync --recursive
            git -C "$repo" submodule update --init --recursive
            chmod +x "$repo/build.sh"
            bash -n "$repo/build.sh"
            printf '%s | tested-v0.1=%s | selected=%s\n' "$name" "$commit" "$actual" | tee -a pinned-core-revisions.txt
            echo "::endgroup::"
          }
          pin_core snes9x-pico 064f14f0316b6298ad64f9e1c139ac2e3db6878b \
            https://github.com/TheGammaSqueeze/snes9x-pico.git
          pin_core genesis-plus-gx-pico 4677960c7a52e69e710358c324e07a497e117b6e \
            https://github.com/TheGammaSqueeze/genesis-plus-gx-pico.git
          test -s lk-mt6785/cores/snes9x-pico/upstream/snes9x.h
          test -s lk-mt6785/cores/genesis-plus-gx-pico/upstream/core/system.c
          git -C lk-mt6785 submodule status --recursive > submodule-versions.txt
          echo "OK: SNES and Genesis cores now use the same exact source revisions as the working v0.1 build."

      - name: Verify and apply Kids restrictions
        run: |
          python3 apply_kids_patch.py lk-mt6785 --check
          python3 apply_kids_patch.py lk-mt6785

      - name: Verify and apply Kids one-tap game exit (v0.2 test)
        shell: bash
        run: |
          set -euo pipefail
          python3 apply_kids_game_exit_patch.py lk-mt6785 --check
          python3 apply_kids_game_exit_patch.py lk-mt6785

      - name: Check prebuilt logo compressor dependencies
        shell: bash
        run: |
          set -euo pipefail
          TOOL="lk-mt6785/dev/logo/tool/zpipe"
          test -x "$TOOL"
          echo "Binary architecture:"
          file "$TOOL"
          echo "Shared library dependencies:"
          ldd "$TOOL" | tee /tmp/gammaos-zpipe-ldd.txt
          ! grep -q 'not found' /tmp/gammaos-zpipe-ldd.txt
          echo "OK: all required zpipe libraries are available."

      # IMPORTANT: The upstream make_sdcard.sh hides emulator compiler errors with
      # "./build.sh >/dev/null 2>&1" and continues if a core fails. Build cores
      # individually first, with real logs, and reject incomplete packages.
      # gpSP's linker aligns load_size to 16 bytes, but objcopy can omit the
      # last zero-filled bytes. Its own build.sh refuses such a short blob.
      # Make ONLY this bounded zero-padding correction; keep all validations.
      - name: Fix gpSP four-byte blob alignment mismatch safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path("lk-mt6785/cores/gpsp-pico/build.sh")
          script = path.read_text()
          old = 'assert load == len(d), "load size %d != file %d" % (load, len(d))'
          new = '''if load != len(d):
              missing = load - len(d)
              if not (0 < missing < 16 and load % 16 == 0 and span >= load and load <= 4 * 1024 * 1024):
                  raise AssertionError("Unexpected gpSP blob size: load %d, file %d" % (load, len(d)))
              with open(sys.argv[1], "ab") as f:
                  f.write(bytes(missing))
              d += bytes(missing)
              print("Added %d zero bytes for gpSP 16-byte alignment" % missing)
          assert load == len(d), "load size %d != file %d" % (load, len(d))'''
          if script.count(old) != 1:
              raise SystemExit("Cannot locate the exact gpSP size check; upstream changed, refusing to modify")
          path.write_text(script.replace(old, new))
          print("Patched gpSP build validation with bounded zero-padding; other checks remain in place")
          PYFIX
          bash -n lk-mt6785/cores/gpsp-pico/build.sh

      # Gambatte's upstream README explicitly tested ARM GNU 10.3-2021.07
      # under Ubuntu 22.04. Unlike GCC 13 + newlib headers, it supports the
      # original freestanding C++ build flags with no speculative patches.
      - name: Verify upstream-tested ARM GCC 10.3 and unchanged Gambatte flags
        shell: bash
        run: |
          set -euo pipefail
          arm-none-eabi-g++ --version | head -n 1
          ARM_GCC_VERSION="$(arm-none-eabi-g++ -dumpfullversion)"
          if [[ "$ARM_GCC_VERSION" != 10.3* ]]; then
            echo "::error title=Unexpected ARM compiler::Expected GCC 10.3.x; found $ARM_GCC_VERSION"
            exit 1
          fi
          grep -F 'ARCH="-march=armv7-a -mfloat-abi=soft -mthumb-interwork -ffreestanding"' lk-mt6785/cores/gambatte-pico/build.sh
          echo "Using upstream Gambatte build.sh unchanged with GCC $ARM_GCC_VERSION"

      # Gambatte deliberately links no libstdc++ runtime. Its freestanding
      # pico_runtime.cpp implements the required std::__throw_* error hooks,
      # but lacks __throw_bad_array_new_length, which the C++ allocator may
      # reference with the installed toolchain. Supply just that hook, using
      # Gambatte's existing non-returning error-handler convention.
      - name: Fix Gambatte missing freestanding C++ array-length handler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYFIX'
          from pathlib import Path
          path = Path('lk-mt6785/cores/gambatte-pico/pico/pico_runtime.cpp')
          source = path.read_text(encoding='utf-8')
          symbol = '__throw_bad_array_new_length'
          anchor = 'void __throw_bad_alloc()                 { for (;;) {} }'
          if symbol in source:
              print('Gambatte runtime already supplies the error handler; no change needed.')
          else:
              if source.count(anchor) != 1:
                  raise SystemExit('Gambatte runtime differs from the verified upstream source; refusing blind modification.')
              addition = anchor + '\nvoid __throw_bad_array_new_length()     { for (;;) {} }'
              path.write_text(source.replace(anchor, addition, 1), encoding='utf-8')
              print('Added std::__throw_bad_array_new_length() to the existing freestanding error handlers.')
          PYFIX
          grep -n -F '__throw_bad_array_new_length()' lk-mt6785/cores/gambatte-pico/pico/pico_runtime.cpp

      - name: Build all six emulator cores with visible diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p kids-diagnostics
          for spec in \
            'armGBA-pico:armgba-pico' \
            'gpsp-pico:gpsp-pico' \
            'gambatte-pico:gambatte-pico' \
            'snes9x-pico:snes9x-pico' \
            'genesis-plus-gx-pico:genesis-plus-gx-pico' \
            'armNES-pico:armnes-pico'; do
            dir="${spec%%:*}"
            core="${spec#*:}"
            repo="lk-mt6785/cores/$dir"
            log="kids-diagnostics/$core.log"
            echo "::group::Building $core"
            if [[ ! -x "$repo/build.sh" ]]; then
              echo "::error title=Missing build script::$repo/build.sh is missing or not executable"
              echo "::endgroup::"
              exit 1
            fi
            if ! (cd "$repo" && ./build.sh) > "$log" 2>&1; then
              echo "::error title=Emulator build failed::$core failed. First compiler errors:"
              grep -n -m 12 -E '(^|[ :])(fatal error:|error:|AssertionError:)' "$log" || true
              echo "First 70 log lines:"
              head -n 70 "$log"
              echo "Last 120 log lines:"
              tail -n 120 "$log"
              echo "::endgroup::"
              exit 1
            fi
            if [[ ! -s "$repo/out/$core.blob" ]]; then
              echo "::error title=Core blob missing::$core build returned success but did not create out/$core.blob"
              tail -n 120 "$log"
              echo "::endgroup::"
              exit 1
            fi
            echo "OK: $core ($(stat -c '%s' "$repo/out/$core.blob") bytes)"
            tail -n 8 "$log"
            echo "::endgroup::"
          done

      - name: Compile Konkr Pocket Advance firmware and SD contents
        working-directory: lk-mt6785
        run: |
          set -euo pipefail
          chmod +x build_konkr_kpa.sh
          ./build_konkr_kpa.sh
          for required in out/lk_a_kpa_signed.img out/sdcard/gammaos/boot.cfg out/sdcard/gammaos/menu.pack; do
            if [[ ! -s "$required" ]]; then
              echo "::error::Missing required build output: $required. SD-card generation did not finish."
              exit 1
            fi
          done
          for core in armgba-pico gpsp-pico gambatte-pico snes9x-pico genesis-plus-gx-pico armnes-pico; do
            test -s "out/sdcard/cores/$core.blob" || {
              echo "::error::Missing emulator core: $core.blob. Do not use this build."
              exit 1
            }
          done

      # The owner confirmed this exact combination works on real hardware:
      # v0.2 firmware for one-tap exit + ORIGINAL v0.1 SNES and Genesis blobs.
      # Pinning the source revisions alone is insufficient; small toolchain or
      # path differences can change the blob. Restore the already device-tested
      # binaries from this project's PUBLIC v0.1 GitHub release after all new
      # sources and SD files are built, then verify their known SHA256 hashes.
      - name: Restore device-tested SNES and Sega cores from v0.1 release
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/bassflower2-netizen/GammaOS-Pico-Kids/releases/download/V0.1.0-Kids/GammaOS-Pico-Kids-KPA.zip"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 3 \
            --output "${RUNNER_TEMP}/gammaos-pico-kids-v0.1.zip" "$url"
          python3 - <<'PYRESTORE'
          import os, hashlib, zipfile, io
          from pathlib import Path

          ARCHIVE = Path(os.environ['RUNNER_TEMP']) / 'gammaos-pico-kids-v0.1.zip'
          OUT = Path('lk-mt6785/out/sdcard/cores')
          EXPECTED = {
              'snes9x-pico.blob': 'b48d5039f236a8f405eda8b05faef4fed29ec3d0285d703635c71b048fd7fd4c',
              'genesis-plus-gx-pico.blob': 'ae9faf2d9d7ebe25620102b44c5fa0578bb3cffbaa0064c62dd84fd24da9a96c',
          }

          def inspect(data: bytes, depth=0):
              if depth > 3 or len(data) > 150 * 1024 * 1024:
                  raise RuntimeError('Unexpected nested release archive depth or size')
              found = {}
              nested = []
              with zipfile.ZipFile(io.BytesIO(data)) as z:
                  for item in z.infolist():
                      if item.is_dir():
                          continue
                      n = item.filename.replace('\\', '/').strip('/')
                      if any(n == f'sdcard/cores/{core}' or n.endswith(f'/sdcard/cores/{core}') for core in EXPECTED):
                          core = n.rsplit('/', 1)[-1]
                          if core in found:
                              raise RuntimeError('Duplicate core in release archive: ' + core)
                          if item.file_size > 8 * 1024 * 1024:
                              raise RuntimeError('Unexpectedly oversized core blob: ' + core)
                          found[core] = z.read(item)
                      elif n.lower().endswith('.zip'):
                          if item.file_size > 150 * 1024 * 1024:
                              raise RuntimeError('Unexpectedly oversized nested ZIP')
                          nested.append(z.read(item))
              if len(found) == len(EXPECTED):
                  return found
              for nested_zip in nested:
                  try:
                      inner = inspect(nested_zip, depth + 1)
                      if set(inner) == set(EXPECTED):
                          return inner
                  except (zipfile.BadZipFile, RuntimeError):
                      continue
              raise RuntimeError('Could not locate BOTH original cores in the v0.1 release')

          files = inspect(ARCHIVE.read_bytes())
          # Validate BOTH before changing either file.
          for core, expected in EXPECTED.items():
              value = hashlib.sha256(files[core]).hexdigest()
              if value != expected:
                  raise SystemExit(f'WRONG original {core}: sha256={value}, expected={expected}')
              print(f'VERIFIED original {core}: SHA256 {value}')
          OUT.mkdir(parents=True, exist_ok=True)
          report = ['Original GammaOS Pico Kids v0.1 tested blobs restored into v0.2.1:']
          for core in EXPECTED:
              target = OUT / core
              if not target.is_file():
                  raise SystemExit(f'Missing newly-built target core: {target}')
              target.write_bytes(files[core])
              report.append(f'{core}  bytes={len(files[core])}  SHA256={EXPECTED[core]}')
          Path('v0.1-proven-cores.txt').write_text('\n'.join(report) + '\n')
          print('\n'.join(report))
          PYRESTORE

      - name: Verify SNES and Sega core binaries match tested v0.1 EXACTLY
        shell: bash
        run: |
          set -euo pipefail
          echo 'b48d5039f236a8f405eda8b05faef4fed29ec3d0285d703635c71b048fd7fd4c  lk-mt6785/out/sdcard/cores/snes9x-pico.blob' | sha256sum --check --status || { echo 'SNES9x binary mismatch'; exit 1; }
          echo 'ae9faf2d9d7ebe25620102b44c5fa0578bb3cffbaa0064c62dd84fd24da9a96c  lk-mt6785/out/sdcard/cores/genesis-plus-gx-pico.blob' | sha256sum --check --status || { echo 'Genesis/Sega binary mismatch'; exit 1; }
          echo 'PASS: both cores are byte-for-byte identical to the versions that worked on the device with v0.2.'

      - name: Package experimental build (do not flash without review)
        run: |
          set -euo pipefail
          mkdir -p kids-output
          cp lk-mt6785/out/lk_a_kpa_signed.img kids-output/
          cp -a lk-mt6785/out/sdcard kids-output/
          cp README_DE.md kids-output/
          cp gammaos-source-commit.txt submodule-versions.txt fallback-submodules.txt pinned-core-revisions.txt v0.1-proven-cores.txt kids-output/
          arm-none-eabi-g++ --version | head -n 1 > kids-output/toolchain-version.txt
          echo "EXPERIMENTAL v0.2.1: v0.2 one-tap bootloader plus byte-identical, device-tested v0.1 SNES/Genesis core files. Verify YOUR device and backup before flashing. Do NOT publish before device-testing full package." > kids-output/UNTESTED_READ_FIRST.txt
          cd kids-output
          zip -qr ../GammaOS-Pico-Kids-KPA-v0.2.1-TESTBUILD.zip .

      - name: Upload build artifact (NOT device-tested)
        uses: actions/upload-artifact@v6
        with:
          name: GammaOS-Pico-Kids-KPA-v0.2.1-TESTBUILD
          path: GammaOS-Pico-Kids-KPA-v0.2.1-TESTBUILD.zip
          if-no-files-found: error


      # Still available when a core fails and no firmware ZIP was produced.
      - name: Upload diagnostic logs when the build fails
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: GammaOS-Pico-Kids-Build-Logs
          path: |
            kids-diagnostics/
            gammaos-source-commit.txt
            fallback-submodules.txt
            submodule-versions.txt
            pinned-core-revisions.txt
            v0.1-proven-cores.txt
          if-no-files-found: ignore

# Build uses Ubuntu 22.04 + ARM GCC 10.3, the toolchain tested by gambatte-pico.
# Missing Gambatte C++ allocator-error handler added to existing freestanding runtime.
# SNES9x checkout repaired only if the original pinned/remote checkout lacks build.sh.
